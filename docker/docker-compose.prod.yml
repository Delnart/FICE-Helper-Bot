# Production compose: pulls pre-built images from GitHub Container Registry
# instead of building on the VPS. This is the file the server uses day-to-day;
# `docker-compose.yml` (with `build:` blocks) stays for local development and
# the rare "build on server" fallback.
#
# Deploy flow (automatic): push to main → GitHub Actions builds both images,
# pushes ghcr.io/delnart/fice-*:{latest,sha-<commit>} and runs `pull` + `up -d`
# here over SSH (see .github/workflows/ci.yml and docs/DEPLOY.md).
# Manual:   docker compose -f docker/docker-compose.prod.yml --env-file .env pull
#           docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
# Rollback: IMAGE_TAG=sha-<commit> docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
#
# Memory budget for a ~1 GB VPS. The caps turn a slow leak into a quick
# automatic restart (restart: unless-stopped) instead of the whole box
# swap-thrashing until someone restarts Docker by hand.

x-logging: &logging
  # json-file logs are unbounded by default and slowly eat the disk.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger's default cache is 50% of (RAM - 1 GB) but never below 256 MB;
    # pin it so Mongo can't grow into the Node processes' share.
    command: ['--wiredTigerCacheSizeGB', '0.25']
    mem_limit: 512m
    logging: *logging
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}

  backend:
    image: ghcr.io/delnart/fice-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so the app shuts down cleanly on deploy.
    init: true
    depends_on:
      - mongo
    mem_limit: 384m
    logging: *logging
    environment:
      NODE_ENV: production
      # Below mem_limit so V8 collects garbage before the kernel OOM-kills.
      NODE_OPTIONS: --max-old-space-size=256
      TZ: Europe/Kyiv
      BACKEND_PORT: 3000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ficebot.dev}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      CAMPUS_API_BASE: ${CAMPUS_API_BASE:-https://api.campus.kpi.ua}
      CAMPUS_API_TOKEN: ${CAMPUS_API_TOKEN:-}
      GOOGLE_SHEETS_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      PUBLIC_WEB_APP_URL: ${PUBLIC_MINI_APP_URL:-https://ficebot.dev}
      PUBLIC_MINI_APP_URL: ${PUBLIC_MINI_APP_URL:-https://ficebot.dev}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
    ports:
      - '3000:3000'

  frontend:
    image: ghcr.io/delnart/fice-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    mem_limit: 192m
    logging: *logging
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      # NEXT_PUBLIC_API_BASE is baked into the bundle at build time (CI build arg).
    ports:
      - '3001:3001'

volumes:
  mongo_data:
